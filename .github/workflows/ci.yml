name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 libsystemd 开发文件
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev pkg-config

      - name: 安装 mise 固定的 Zig
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: 工具版本
        run: mise exec -- zig version

      - name: 格式检查
        run: mise exec -- zig fmt --check src/*.zig build.zig build.zig.zon

      - name: 离线测试
        run: mise exec -- zig build test --test-timeout 120s

      - name: 构建
        run: mise exec -- zig build

      - name: 安装布局冒烟
        run: |
          mise exec -- zig build install --prefix "$RUNNER_TEMP/prefix"
          test -x "$RUNNER_TEMP/prefix/bin/f9ctl"
          test -f "$RUNNER_TEMP/prefix/share/man/man1/f9ctl.1"
          test -f "$RUNNER_TEMP/prefix/lib/systemd/system/f9d.service"
          test -f "$RUNNER_TEMP/prefix/lib/udev/rules.d/99-legion-f9.rules"

      - name: 敏感信息检查
        run: ./tools/check-sensitive.sh
