name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64 使用原生 ARM64 runner（SPEC：Linux aarch64 为正式平台）。
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev libdbus-1-dev pkg-config
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p f9ctl -p f9d
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/f9ctl dist/
          cp target/${{ matrix.target }}/release/f9d dist/
          cp -r packaging dist/
          cp config/f9d.example.toml dist/
          cp README.md README.en.md LICENSE NOTICE.md CHANGELOG.md dist/
          tar -czf legion-f9-control-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist .
          sha256sum legion-f9-control-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > checksums.txt
      - name: Package (Windows, experimental)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/f9ctl.exe dist/
          Copy-Item target/${{ matrix.target }}/release/f9d.exe dist/
          Copy-Item README.md,README.en.md,LICENSE,NOTICE.md,CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath legion-f9-control-${{ github.ref_name }}-${{ matrix.target }}.zip
          $archive = "legion-f9-control-${{ github.ref_name }}-${{ matrix.target }}.zip"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File -Encoding ascii checksums-windows.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            checksums*.txt

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Generate SBOM (CycloneDX)
        run: |
          cargo install --locked cargo-cyclonedx || cargo install cargo-cyclonedx
          cargo cyclonedx --all --format json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: "**/*.cdx.json"

  release:
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist-all
      - name: Verify checksums & publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 下载后的 artifact 位于分目标子目录；统一生成带相对路径的校验表。
          find dist-all -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > CHECKSUMS.txt
          sha256sum -c CHECKSUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "见 CHANGELOG.md。Windows 构建为 experimental。" \
            CHECKSUMS.txt dist-all/artifacts-*/*.tar.gz dist-all/artifacts-*/*.zip
