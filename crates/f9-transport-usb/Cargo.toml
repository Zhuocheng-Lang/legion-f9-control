[package]
name = "f9-transport-usb"
description = "USB HID transport (report ID 4) for Legion F9 devices: Linux stable, Windows experimental"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
f9-protocol.workspace = true
f9-transport.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# hidraw 后端：设备路径为 /dev/hidrawN，uaccess（udev 规则）直接生效；
# sysfs report_descriptor 校验可用；键盘等无关接口被 report 4 校验过滤。
# libusb 后端走 /dev/bus/usb 节点，uaccess 不覆盖且无 descriptor 校验。
hidapi = { version = "2", default-features = false, features = ["linux-static-hidraw"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2", default-features = false }

[features]
default = ["hid-backend"]
# hid-backend: 使用 hidapi 枚举与收发。禁用后仅保留纯逻辑（供受限构建环境）。
hid-backend = []

[lints]
workspace = true
